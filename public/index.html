<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link id="site-icon" rel="icon" href="%PUBLIC_URL%/js_puzzle_solver_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="%PUBLIC_URL%/fonts/geist-mono-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/leaderboard.css" />
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.innerWidth > 768 && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1c1c1e' : '#ffffff';
        document.getElementById('site-icon').href = theme === 'dark' ? '%PUBLIC_URL%/js_puzzle_solver_logo_dark.svg' : '%PUBLIC_URL%/js_puzzle_solver_logo.svg';
      })();
    </script>
    <meta
      name="description"
      content="Jane Street Puzzle Leaderboard"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/js_puzzle_solver_logo.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>JS Puzzle Leaderboard</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
